<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smoke Sayacı - Increment Feedback</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#0b1326",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary": "#b7c8e1",
                        "primary": "#b4c5ff",
                        "surface": "#0b1326",
                        "surface-dim": "#0b1326",
                        "surface-container-low": "#131b2e",
                        "primary-container": "#2563eb",
                        "tertiary-fixed": "#ffdbcd",
                        "on-primary-container": "#eeefff",
                        "on-background": "#dae2fd",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary-fixed": "#00174b",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-surface-variant": "#c3c6d7",
                        "surface-container": "#171f33",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary-container": "#bc4800",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#31394d",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-secondary-fixed": "#0b1c30",
                        "outline": "#8d90a0",
                        "on-tertiary": "#581e00",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#ffb596",
                        "tertiary": "#ffb596",
                        "surface-container-highest": "#2d3449",
                        "on-secondary-container": "#a9bad3",
                        "on-tertiary-container": "#ffede6",
                        "error-container": "#93000a",
                        "surface-tint": "#b4c5ff",
                        "on-tertiary-fixed": "#360f00",
                        "on-secondary": "#213145",
                        "secondary-fixed": "#d3e4fe",
                        "surface-container-high": "#222a3d",
                        "on-primary": "#002a78",
                        "surface-variant": "#2d3449",
                        "inverse-primary": "#0053db",
                        "inverse-on-surface": "#283044",
                        "secondary-container": "#3a4a5f",
                        "surface-container-lowest": "#060e20",
                        "primary-fixed": "#dbe1ff",
                        "outline-variant": "#434655",
                        "on-surface": "#dae2fd",
                        "on-error": "#690005",
                        "inverse-surface": "#dae2fd",
                        "success": "#22c55e"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body antialiased min-h-screen flex flex-col relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Success Glow (Atmospheric effect) -->
<div class="fixed top-[40%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-success/15 blur-[80px] rounded-full pointer-events-none z-0"></div>
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-40 bg-[#0b1326]/60 backdrop-blur-xl border-none shadow-none">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-[480px] mx-auto">
<div class="text-xl font-black text-[#f8fafc] font-['Inter'] tracking-tight">
                Smoke Sayacı
            </div>
<div class="flex items-center gap-4 text-[#b4c5ff]">
<button class="hover:bg-[#222a3d] transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">history</span>
</button>
<button class="hover:bg-[#222a3d] transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[480px] mx-auto px-6 pt-12 pb-32 flex flex-col relative z-10">
<!-- The Counter Card (Hero) -->
<section class="relative bg-surface-container-high rounded-[32px] p-10 flex flex-col items-center justify-center shadow-[0_20px_40px_-10px_rgba(0,0,0,0.3)] shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)] w-full mb-12 isolate overflow-hidden">
<!-- Subtle background texture/radial within card -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-bright/10 to-transparent pointer-events-none"></div>
<h2 class="text-on-surface-variant font-label text-xs uppercase tracking-[0.05em] font-medium mb-6 relative z-10">
                Bugün
            </h2>
<div class="relative z-10 flex items-center justify-center">
<!-- Floating +1 Indicator (Visual Confirmation) -->
<div class="absolute -top-4 -right-10 text-success font-bold text-2xl drop-shadow-[0_0_12px_rgba(34,197,94,0.6)]">
                    +1
                </div>
<!-- The Massive Number -->
<div class="text-[140px] font-display font-medium tracking-tight text-primary leading-none drop-shadow-xl">
                    5
                </div>
</div>
<div class="mt-8 flex items-center gap-2 text-sm text-on-surface-variant bg-surface-container-lowest/50 px-4 py-2 rounded-full relative z-10 border border-outline-variant/10">
<span class="material-symbols-outlined text-[16px] text-success">check_circle</span>
<span>Son ekleme: az önce</span>
</div>
</section>
<!-- Contextual Stats (Floating below) -->
<section class="grid grid-cols-2 gap-4 mb-auto w-full">
<div class="bg-surface-container-low rounded-2xl p-4 flex flex-col shadow-[0_10px_20px_-5px_rgba(0,0,0,0.2)] shadow-[inset_0_1px_0_0_rgba(255,255,255,0.02)]">
<span class="text-on-surface-variant font-label text-[10px] uppercase tracking-[0.05em] mb-1">Dün</span>
<span class="text-on-surface font-headline text-2xl font-semibold">4</span>
</div>
<div class="bg-surface-container-low rounded-2xl p-4 flex flex-col shadow-[0_10px_20px_-5px_rgba(0,0,0,0.2)] shadow-[inset_0_1px_0_0_rgba(255,255,255,0.02)]">
<span class="text-on-surface-variant font-label text-[10px] uppercase tracking-[0.05em] mb-1">Fark</span>
<span class="text-success font-headline text-2xl font-semibold flex items-center">
<span class="material-symbols-outlined text-[18px] mr-1">trending_up</span> %25
                </span>
</div>
</section>
<!-- Main Action Area -->
<div class="w-full flex justify-center mt-12 mb-8">
<!-- Pressed State Button -->
<button class="w-[120px] h-[120px] rounded-full bg-gradient-to-b from-primary-container to-inverse-primary flex items-center justify-center shadow-[inset_0_4px_10px_rgba(0,0,0,0.4)] scale-95 ring-4 ring-primary-container/20 relative group">
<!-- Inner glow for pressed feel -->
<div class="absolute inset-0 rounded-full shadow-[inset_0_-2px_10px_rgba(255,255,255,0.1)]"></div>
<div class="flex flex-col items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-4xl mb-1" style="font-variation-settings: 'FILL' 1;">add</span>
<span class="font-label text-sm uppercase tracking-widest font-bold">Arttır</span>
</div>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-[#0b1326]/80 backdrop-blur-2xl border-none shadow-2xl">
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] flex justify-around items-center p-4">
<!-- Active Tab: Sayaç -->
<button class="flex flex-col items-center justify-center text-[#b4c5ff] bg-[#2563eb]/20 rounded-xl px-4 py-1 active:scale-90 transition-transform w-[72px]">
<span class="material-symbols-outlined mb-1 text-[24px]" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-[0.05em] font-medium">Sayaç</span>
</button>
<!-- Inactive Tab: İstatistik -->
<button class="flex flex-col items-center justify-center text-[#c3c6d7] hover:text-[#f8fafc] active:scale-90 transition-transform w-[72px]">
<span class="material-symbols-outlined mb-1 text-[24px]">leaderboard</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-[0.05em] font-medium">İstatistik</span>
</button>
<!-- Inactive Tab: Geçmiş -->
<button class="flex flex-col items-center justify-center text-[#c3c6d7] hover:text-[#f8fafc] active:scale-90 transition-transform w-[72px]">
<span class="material-symbols-outlined mb-1 text-[24px]">history</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-[0.05em] font-medium">Geçmiş</span>
</button>
</div>
</nav>
</body></html>
